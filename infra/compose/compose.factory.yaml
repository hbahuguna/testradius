name: testradius-factory

services:
  cell:
    build:
      context: ../../apps/cell
    image: testradius-cell:dev
    ports:
      - "58000:8000"
    environment:
      CELL_VERSION: "0.1.0"
      CELL_AUT_HEALTH_URL: "http://mock-aut:8080/api/health"
      CELL_GRAPH_HEALTH_URL: "http://neo4j:7474"
      CELL_STATE_DIR: "/workspace/state"
      CELL_FIXTURE_REPO_PATH: "/workspace/fixture"
      CELL_VAULT_ADDR: "http://vault:8200"
      CELL_VAULT_TOKEN: "dev-root-token"
    # Hardening enforced at runtime, not just in the Dockerfile (E1-S1 / ADR-001).
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/cell/.cache:size=256m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    volumes:
      - cell-workspace:/workspace
      - ../../packages/test-fixtures/aut:/workspace/fixture:ro
    depends_on:
      mock-aut:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  control-plane:
    build:
      context: ../..
      dockerfile: apps/control-plane/Dockerfile
    image: testradius-control-plane:dev
    ports:
      - "58001:8080"
    environment:
      PORT: "8080"
      FACTORY_REQUIRE_DB: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: testradius-web:dev
    ports:
      - "53000:80"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-aut:
    build:
      context: ../../packages/test-fixtures/aut
    image: testradius-fixture-aut:dev
    ports:
      - "58080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-oidc:
    build:
      context: ../../packages/test-fixtures/mock-oidc
    image: testradius-mock-oidc:dev
    ports:
      - "58090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testsquad
      POSTGRES_PASSWORD: testsquad_password
      POSTGRES_DB: factory
    ports:
      - "55432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsquad -d factory"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/testsquad_password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "57474:7474"
      - "57687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "cypher-shell -u neo4j -p testsquad_password 'RETURN 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tr-dev
      MINIO_ROOT_PASSWORD: tr-dev-minio-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev-only secrets broker. Values are generated by `make secrets` and never
  # written to disk (E0-S8).
  vault:
    image: hashicorp/vault:1.18
    command: server -dev -dev-root-token-id=dev-root-token -dev-listen-address=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "58200:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cell-workspace:
  pg-data:
  neo4j-data:
  minio-data:
