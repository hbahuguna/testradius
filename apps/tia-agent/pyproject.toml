[project]
name = "tia-agent"
version = "0.1.0"
description = "Standalone conversational TIA agent — runs Test Impact Analysis on any repo/PR via TestRadius, with licensing"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "tia-license-client",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tia_agent"]

[project.scripts]
tia-agent = "tia_agent.interfaces.cli:main"

[tool.uv.sources]
tia-license-client = { path = "../../packages/license-client", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]