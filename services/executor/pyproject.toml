[tool.poetry]
name = "testsquad-executor"
version = "0.1.0"
description = "TestSquad Executor Service - Isolated Sandbox"
authors = ["TestSquad Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
httpx = "^0.26.0"
docker = "^7.1.0"
testsquad-shared = { path = "../../packages/shared", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
