[project]
name = "tia-license-server"
version = "0.1.0"
description = "License activation, subscription validation and TIA run metering for the commercial TIA agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["license_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
