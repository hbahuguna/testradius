[project]
name = "testsquad-workbench"
version = "0.1.0"
description = "TestRadius Workbench — visual test automation IDE"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "pydantic>=2.12.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "playwright>=1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
testpaths = ["tests"]
