[tool.poetry]
name = "testsquad-core"
version = "0.1.0"
description = "TestSquad Core Service - Sentinel Brain"
authors = ["TestSquad Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
httpx = ">=0.26.0,<0.28.0"
google-generativeai = "^0.4.0"
anthropic = "^0.18.0"
sqlmodel = "^0.0.16"
asyncpg = "^0.29.0"
greenlet = ">=3.0.0,<3.5.0"
alembic = "^1.13.1"
neo4j = "^5.18.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
PyGithub = "^2.2.0"
Jinja2 = "^3.1.3"
tree-sitter = "^0.21.3"
tree-sitter-python = "^0.21.0"
tree-sitter-javascript = "^0.21.0"
tree-sitter-typescript = "^0.21.0"
pygls = "^1.3.1"
lsprotocol = "^2023.0.0"
networkx = "^3.2.1"
python-igraph = "^0.11.4"
leidenalg = "^0.10.2"
gitpython = "^3.1.40"
testsquad-shared = { path = "../../packages/shared", develop = true }

[tool.poetry.extras]
ml = ["sentence-transformers", "rank-bm25"]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
