# TestRadius — Cloud VM deployment
# Uses env vars (set via .env file or export):
#   TESTRADIUS_SRC   Path to Test-Radius target repo (default: ../Test-Radius)
#   PUBLIC_IP        Public IP or domain for API URL (default: localhost)
#   DOMAIN           Public domain for Caddy TLS (optional)

services:
  core-ml:
    build:
      context: .
      dockerfile: services/core/Dockerfile
      args:
        INSTALL_ML: "true"
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    profiles:
      - ml
    env_file:
      - .env
    environment:
      - EXECUTOR_URL=http://executor:8001
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://testsquad:testsquad_password@db:5432/testsquad
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testsquad_password
      - TESTRADIUS_LOCAL_PATH=/testradius
      - CORS_ORIGINS=http://${PUBLIC_IP:-localhost}:5173
    volumes:
      - ./services/core/testsquad_core:/app/testsquad_core
      - ./packages/shared:/app/packages/shared
      - ./method2test:/app/method2test
      - testradius_workspaces:/tmp/testsquad-workspaces
      - ${TESTRADIUS_SRC:-../Test-Radius}:/testradius
    networks:
      - testsquad-net
    depends_on:
      db:
        condition: service_started
      neo4j:
        condition: service_started

  executor:
    build:
      context: .
      dockerfile: services/executor/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PYTHONPATH=/app
      - EXECUTOR_NETWORK=testsquad-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - testsquad-net

  ui:
    build:
      context: ./ui
    restart: unless-stopped
    ports:
      - "0.0.0.0:5173:5173"
    environment:
      - VITE_API_URL=http://${PUBLIC_IP:-localhost}:8000
    networks:
      - testsquad-net

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=testsquad
      - POSTGRES_PASSWORD=testsquad_password
      - POSTGRES_DB=testsquad
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - testsquad-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsquad"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/testsquad_password
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - testsquad-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testsquad_password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  neo4j_data:
  testradius_workspaces:

networks:
  testsquad-net:
    driver: bridge
