[project]
name = "tia-license-client"
version = "0.1.0"
description = "License client for the commercial TIA agent: activation, daily validation, offline grace, run metering"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["license_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
