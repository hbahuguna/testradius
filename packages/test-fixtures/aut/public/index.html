<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture Shop</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Fixture Shop</h1>
      <!-- a11y defect #1: icon-only link with no accessible name -->
      <a href="/cart" class="icon-link" data-testid="cart-link">
        <svg width="18" height="18" aria-hidden="true" focusable="false">
          <circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </a>
    </header>

    <main>
      <h2>Menu</h2>
      <ul id="products" data-testid="products"></ul>

      <!-- a11y defect #2: empty icon button with no accessible name -->
      <button class="icon-btn" data-testid="remove-item" data-icon="trash"></button>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
