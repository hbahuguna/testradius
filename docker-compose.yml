services:
  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
      args:
        INSTALL_ML: "false"
    ports:
      - "8000:8000"
    profiles:
      - default
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://testsquad:testsquad_password@db:5432/testsquad
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testsquad_password
    volumes:
      - ./services/core/testsquad_core:/app/testsquad_core
      - ./packages/shared:/app/packages/shared
    networks:
      - testsquad-net
    depends_on:
      - db
      - neo4j

  core-ml:
    build:
      context: .
      dockerfile: services/core/Dockerfile
      args:
        INSTALL_ML: "true"
    ports:
      - "8000:8000"
    profiles:
      - ml
    env_file:
      - .env
    environment:
      - EXECUTOR_URL=http://executor:8001
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://testsquad:testsquad_password@db:5432/testsquad
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testsquad_password
      - TESTRADIUS_LOCAL_PATH=/testradius
    volumes:
      - ./services/core/testsquad_core:/app/testsquad_core
      - ./packages/shared:/app/packages/shared
      - ./method2test:/app/method2test
      - /tmp/testsquad-workspaces:/tmp/testsquad-workspaces
      - /Users/skaparwan/Git/Test-Radius:/testradius
    networks:
      - testsquad-net
    depends_on:
      - db
      - neo4j

  executor:
    build:
      context: .
      dockerfile: services/executor/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - EXECUTOR_NETWORK=testsquad-sandbox
    volumes:
      - /Users/skaparwan/.docker/run/docker.sock:/var/run/docker.sock
    networks:
      - testsquad-net
    depends_on: []

  ui:
    build:
      context: ./ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    networks:
      - testsquad-net

  workbench:
    build:
      context: .
      dockerfile: services/workbench/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./services/workbench/testsquad_workbench:/app/testsquad_workbench
    command: ["uvicorn", "testsquad_workbench.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    networks:
      - testsquad-net
    profiles:
      - workbench

  workbench-sdet:
    build:
      context: .
      dockerfile: services/workbench/Dockerfile
    ports:
      - "8003:8002"
    environment:
      - PYTHONPATH=/app:/app/services/workbench
      - SDET_MODEL_PATH=/model
      - SDET_BASE_MODEL=Qwen/Qwen3-8B
    volumes:
      - ./services/workbench:/app/services/workbench
      - /Users/skaparwan/Documents/qwen3-8b-sdet:/model
    # ML deps (torch, transformers, unsloth) needed only for model inference.
    # Without them, the API runs in rule-based mode and gracefully skips model loading.
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    networks:
      - testsquad-net
    profiles:
      - workbench
    # GPU: add `runtime: nvidia` + deploy.resources.reservations.devices for Linux/NVIDIA

  workbench-ui:
    build:
      context: .
      dockerfile: apps/workbench/Dockerfile
    ports:
      - "5174:5174"
    environment:
      # VITE_WORKBENCH_API=http://localhost:8002  # removed: let it default to empty so iframe uses Vite proxy
      - VITE_PROXY_TARGET=http://workbench:8002
      - VITE_SDET_API=http://localhost:8003
    volumes:
      - ./apps/workbench/src:/app/src
    networks:
      - testsquad-net
    profiles:
      - workbench

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=testsquad
      - POSTGRES_PASSWORD=testsquad_password
      - POSTGRES_DB=testsquad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - testsquad-net

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/testsquad_password
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - testsquad-net

volumes:
  postgres_data:
  neo4j_data:

networks:
  testsquad-net:
    driver: bridge
